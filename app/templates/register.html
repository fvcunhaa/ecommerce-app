<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Criar conta | ObsStore</title><link rel="stylesheet" href="{{ url_for('static', filename='obsstore.css') }}"></head><body class="auth-page"><div class="auth-card"><a class="brand" href="/"><span class="brand-copy"><strong>OBS<span>STORE</span></strong><small>NOVO CLIENTE</small></span></a><h1>Criar cadastro</h1><p>Cadastre-se para acompanhar pedidos e compras.</p>{% if error %}<div class="auth-error">{{ error }}</div>{% endif %}<form method="post"><label>Nome completo<input name="name" required></label><label>E-mail<input type="email" name="email" required></label><label>Senha<input type="password" name="password" minlength="6" required></label><label>Estado<select name="state">{% for s in ['SP','RJ','MG','PR','RS','SC','BA','GO','PE','CE','ES'] %}<option>{{ s }}</option>{% endfor %}</select></label><button type="submit">Criar minha conta</button></form><div class="auth-links"><a href="/">Voltar à loja</a><a href="/login">Já tenho conta</a></div></div></body></html>
