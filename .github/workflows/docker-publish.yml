name: Build and Publish ObsStore Images

on:
  push:
    branches:
      - main
      - feature/obsstore-v2
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: fvcunhaa

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: obsstore-api
            context: .
            dockerfile: ./Dockerfile
          - name: obsstore-payment
            context: ./services/payment
            dockerfile: ./services/payment/Dockerfile
          - name: obsstore-shipping
            context: ./services/shipping
            dockerfile: ./services/shipping/Dockerfile
          - name: obsstore-simulator
            context: ./simulator
            dockerfile: ./simulator/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Definir tag do ambiente
        id: vars
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "channel=latest" >> "$GITHUB_OUTPUT"
          else
            echo "channel=obsstore-v2" >> "$GITHUB_OUTPUT"
          fi

      - name: Build e Push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ env.OWNER }}/${{ matrix.name }}:${{ steps.vars.outputs.channel }}
            ghcr.io/${{ env.OWNER }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
